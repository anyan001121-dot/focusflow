# Quiet, readable colors; system fonts avoid external font requests.
[theme]
base = "light"
primaryColor = "#A83C58"
backgroundColor = "#FFFBF7"
secondaryBackgroundColor = "#FFF0E7"
textColor = "#493D39"
linkColor = "#A83C58"
borderColor = "#E6D9CE"
font = "sans serif"
baseFontSize = 17
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFF3EA"
secondaryBackgroundColor = "#F9E7DD"
textColor = "#493D39"
primaryColor = "#A83C58"
